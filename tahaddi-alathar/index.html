<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="مسابقة فرق تفاعلية مصاحبة لورشة «توظيف الذكاء الاصطناعي في الأعمال الإدارية: من الأمر إلى الأثر» · تصميم زواد">
<meta property="og:title" content="تحدي الأثر · زواد">
<meta property="og:image" content="../og-image.jpg">
<title>تحدي الأثر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: projector stage. Burgundy band on top (brand + live scores), cream stage below, one view at a time. Single brand theme by choice. */
:root {
  --burg: #651F2B; --burg-deep: #4E1721; --rose: #8C4A55; --beige: #E0D9CD; --cream: #F5F0E6;
  --paper: #FFFDF9; --ink: #3A2E2B; --muted: #6E5D59; --line: #D9CEBF;
  --ok: #2F6B4F; --ok-bg: #E3EFE7; --bad: #9A3A2E; --bad-bg: #F6E3DF; --gold: #B8893B;
  --f-body: "Tajawal", "Segoe UI", Tahoma, sans-serif;
  --f-display: "Reem Kufi", "Tajawal", "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--cream); color: var(--ink); font-family: var(--f-body); font-size: clamp(15px, 1.25vw, 20px); line-height: 1.6; direction: rtl; }
* { box-sizing: border-box; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app { min-height: 100%; display: flex; flex-direction: column; }

/* top band */
.band { background: var(--burg); color: var(--cream); }
.band .wrap { display: flex; align-items: center; gap: 18px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand img { height: 46px; width: auto; }
.brand .name { font-family: var(--f-display); font-size: 1.5em; line-height: 1.1; }
.brand .sub { font-size: .72em; color: var(--beige); }
.nav { margin-inline-start: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.nav button { background: transparent; color: var(--beige); padding: 6px 12px; font-size: .85em; font-weight: 700; }
.nav button[aria-current="true"] { background: var(--cream); color: var(--burg); }
.nav button:hover { color: var(--cream); background: var(--burg-deep); }
.nav button[aria-current="true"]:hover { color: var(--burg); background: var(--cream); }

/* live score strip */
.strip { background: var(--burg-deep); }
.strip .wrap { display: flex; gap: 10px; padding-block: 8px; overflow-x: auto; }
.chip { display: flex; align-items: center; gap: 10px; background: rgba(245,240,230,.08); border: 1px solid rgba(224,217,205,.25); color: var(--cream); padding: 6px 14px; border-radius: 999px; white-space: nowrap; }
.chip .pts { font-family: var(--f-display); font-size: 1.25em; color: var(--beige); font-variant-numeric: tabular-nums; }
.chip .tools { display: flex; gap: 4px; }
.tag { font-size: .62em; padding: 2px 7px; border-radius: 999px; background: var(--beige); color: var(--burg); font-weight: 800; }
.tag.off { background: transparent; color: rgba(224,217,205,.45); text-decoration: line-through; border: 1px solid rgba(224,217,205,.25); }

main { flex: 1; }
main .wrap { padding-block: 26px 30px; max-width: 1500px; margin: 0 auto; }
footer { color: var(--muted); font-size: .72em; }
footer .wrap { padding-block: 10px 14px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); max-width: 1500px; margin: 0 auto; }
kbd { font-family: var(--f-body); background: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; }

h1, h2 { font-family: var(--f-display); color: var(--burg); line-height: 1.25; text-wrap: balance; margin: 0; }
h1 { font-size: 2.1em; } h2 { font-size: 1.45em; }
.lead { color: var(--muted); margin: 6px 0 0; max-width: 70ch; }
.btn { background: var(--burg); color: var(--cream); padding: 10px 20px; font-weight: 700; }
.btn:hover { background: var(--burg-deep); }
.btn.ghost { background: transparent; color: var(--burg); border: 2px solid var(--burg); }
.btn.ghost:hover { background: var(--burg); color: var(--cream); }
.btn.soft { background: var(--beige); color: var(--burg); }
.btn.soft:hover { background: #d4cbbc; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* setup */
.setup { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
.teams { display: grid; gap: 10px; margin: 16px 0; }
.team-in { display: flex; gap: 8px; align-items: center; }
.team-in .n { font-family: var(--f-display); color: var(--rose); width: 1.6em; text-align: center; }
input[type=text], input[type=number], textarea, select { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 12px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 70px; line-height: 1.6; }
.rules { display: grid; gap: 12px; margin: 14px 0 0; padding: 0; list-style: none; }
.rules li { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; }
.rules .ico { font-family: var(--f-display); background: var(--burg); color: var(--cream); border-radius: 8px; padding: 2px 10px; font-size: .85em; white-space: nowrap; }
.rules b { color: var(--burg); }

/* board */
.board-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.board-scroll { overflow-x: auto; padding-bottom: 6px; }
.board { display: grid; grid-template-columns: repeat(6, minmax(150px, 1fr)); gap: 12px; min-width: 940px; }
.col-h { background: var(--paper); border: 1px solid var(--line); border-top: 5px solid var(--burg); border-radius: 12px; padding: 10px 12px; min-height: 96px; }
.col-h .day { font-size: .7em; color: var(--rose); font-weight: 800; letter-spacing: .02em; }
.col-h .t { font-family: var(--f-display); color: var(--burg); font-size: 1.12em; line-height: 1.3; }
.tile { background: var(--burg); color: var(--cream); font-family: var(--f-display); font-size: 2.2em; padding: 14px 0; border-radius: 12px; font-variant-numeric: tabular-nums; transition: transform .15s ease, background .15s ease; }
.tile:hover { background: var(--burg-deep); transform: translateY(-2px); }
.tile.used { background: var(--beige); color: #b3a796; font-size: 1em; font-family: var(--f-body); font-weight: 700; }
.tile.used:hover { transform: none; background: #d4cbbc; }
.final-tile { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: var(--paper); border: 2px dashed var(--burg); border-radius: 14px; padding: 14px 20px; }
.final-tile .t { font-family: var(--f-display); color: var(--burg); font-size: 1.3em; }

/* question */
.qtop { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.qtop .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pill { background: var(--paper); border: 1px solid var(--line); color: var(--burg); padding: 4px 14px; border-radius: 999px; font-weight: 800; font-size: .85em; }
.pill.pts { background: var(--burg); color: var(--cream); border-color: var(--burg); font-family: var(--f-display); font-size: 1em; }
.qgrid { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 28px; align-items: start; }
.prompt { font-family: var(--f-display); font-size: 1.9em; color: var(--ink); line-height: 1.5; margin: 0 0 18px; text-wrap: balance; }
.source { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-bottom: 20px; }
.doc { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; font-size: 1.12em; }
.doc .lb { display: block; font-size: .7em; font-weight: 800; color: var(--rose); margin-bottom: 4px; }
.doc.ai { border-color: var(--rose); border-style: dashed; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.opts.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opt { display: flex; gap: 14px; align-items: center; text-align: right; background: var(--paper); color: var(--ink); border: 2px solid var(--line); padding: 16px 18px; border-radius: 14px; font-size: 1.12em; font-weight: 500; line-height: 1.5; min-height: 84px; }
.opt .k { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; background: var(--cream); color: var(--burg); font-family: var(--f-display); font-size: 1.15em; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.right .k { background: var(--ok); color: #fff; }
.opt.dim { opacity: .45; }
.explain { margin-top: 18px; background: var(--paper); border-right: 6px solid var(--ok); border-radius: 10px; padding: 14px 18px; }
.explain b { color: var(--ok); }

/* timer */
.side { display: grid; gap: 14px; position: sticky; top: 14px; }
.timer { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; justify-items: center; gap: 10px; }
.ring { position: relative; width: 150px; height: 150px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { fill: none; stroke: var(--beige); stroke-width: 10; }
.ring .bar { fill: none; stroke: var(--burg); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .95s linear, stroke .3s; }
.ring.low .bar { stroke: var(--bad); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: 3em; color: var(--burg); font-variant-numeric: tabular-nums; }
.ring.low .num { color: var(--bad); }
.ring.done .num { font-size: 1.4em; }
.timer .row { justify-content: center; }
.timer .btn { padding: 8px 14px; font-size: .9em; }

/* award */
.award { margin-top: 22px; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.award h3 { margin: 0 0 4px; font-family: var(--f-display); color: var(--burg); font-size: 1.15em; }
.award .hint { color: var(--muted); font-size: .85em; margin: 0 0 12px; }
.agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.acard { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; }
.acard.armed { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(184,137,59,.18); }
.acard .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.acard .tn { font-weight: 800; color: var(--burg); }
.acard .sc { font-family: var(--f-display); font-variant-numeric: tabular-nums; color: var(--muted); }
.acard .row { gap: 6px; }
.mini { padding: 5px 10px; font-size: .8em; font-weight: 700; border-radius: 8px; background: var(--cream); color: var(--burg); border: 1px solid var(--line); }
.mini.main { background: var(--burg); color: var(--cream); border-color: var(--burg); }
.mini.gold { background: var(--gold); color: #fff; border-color: var(--gold); }
.mini:disabled { opacity: .4; cursor: not-allowed; }
.done-flag { font-size: .8em; color: var(--ok); font-weight: 800; }

/* final */
.task { font-family: var(--f-display); font-size: 1.7em; line-height: 1.55; color: var(--ink); margin: 6px 0 20px; text-wrap: balance; }
.rub-scroll { overflow-x: auto; }
table.rub { border-collapse: collapse; width: 100%; min-width: 640px; background: var(--paper); border-radius: 12px; overflow: hidden; }
.rub th, .rub td { border: 1px solid var(--line); padding: 10px 12px; text-align: center; }
.rub th { background: var(--burg); color: var(--cream); font-weight: 700; }
.rub td:first-child, .rub th:first-child { text-align: right; }
.rub td:first-child { font-weight: 700; color: var(--burg); }
.rub input { width: 22px; height: 22px; accent-color: var(--burg); }
.rub .tot { font-family: var(--f-display); color: var(--burg); font-size: 1.2em; font-variant-numeric: tabular-nums; }

/* scores */
.podium { display: grid; gap: 12px; margin-top: 20px; }
.rank { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto auto; gap: 16px; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px 18px; }
.rank .pos { font-family: var(--f-display); font-size: 2em; color: var(--rose); text-align: center; }
.rank.first { background: var(--burg); border-color: var(--burg); color: var(--cream); }
.rank.first .pos, .rank.first .big { color: var(--beige); }
.rank .tn { font-size: 1.3em; font-weight: 800; }
.rank .big { font-family: var(--f-display); font-size: 2.2em; color: var(--burg); font-variant-numeric: tabular-nums; }
.rank .adj { display: flex; gap: 6px; }
.winner { text-align: center; padding: 30px 16px; background: var(--burg); color: var(--cream); border-radius: 18px; margin-top: 20px; }
.winner img { height: 70px; width: auto; }
.winner .w { font-family: var(--f-display); font-size: 2.6em; margin: 8px 0 0; }

/* editor */
.ed-head { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin: 16px 0; }
.ed-head label { display: grid; gap: 4px; font-size: .85em; font-weight: 700; color: var(--burg); }
.qcard { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; margin-bottom: 14px; }
.qcard .hd { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.qcard .hd b { font-family: var(--f-display); color: var(--burg); font-size: 1.1em; }
.f2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.fld { display: grid; gap: 4px; font-size: .82em; font-weight: 700; color: var(--muted); }
.oprow { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center; }
.oprow input[type=radio] { width: 20px; height: 20px; accent-color: var(--ok); }
.saved { color: var(--ok); font-weight: 700; font-size: .85em; }
.confirm { background: var(--bad-bg); border: 1px solid var(--bad); border-radius: 12px; padding: 12px 16px; }

@media (max-width: 900px) {
  .setup, .qgrid, .source, .f2 { grid-template-columns: minmax(0, 1fr); }
  .opts, .opts.three { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; grid-template-columns: minmax(0, 1fr); }
  .prompt { font-size: 1.45em; }
  .rank { grid-template-columns: 44px minmax(0, 1fr) auto; }
  .rank .adj { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pop { 0% { transform: scale(.96); opacity: .6 } 100% { transform: none; opacity: 1 } }
.pop { animation: pop .25s ease-out; }

/* standalone page reset */
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
</style>
</head>

/* ---------- sound ---------- */
let actx = null;
function beep(freq = 660, dur = 0.18, times = 1) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < times; i++) {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * (dur + 0.08);
      o.frequency.value = freq; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur + 0.02);
    }
  } catch (e) {}
}

/* ---------- timer ---------- */
let T = { total: 30, left: 30, id: null };
const CIRC = 2 * Math.PI * 64;
function setTimer(sec) { stopTimer(); T.total = sec; T.left = sec; paintTimer(); }
function stopTimer() { if (T.id) { clearInterval(T.id); T.id = null; } paintBtns(); }
function toggleTimer() {
  if (T.id) { stopTimer(); return; }
  if (T.left <= 0) T.left = T.total;
  T.id = setInterval(() => {
    T.left -= 1;
    if (T.left <= 5 && T.left > 0) beep(880, 0.08);
    if (T.left <= 0) { T.left = 0; stopTimer(); beep(440, 0.35, 2); }
    paintTimer();
  }, 1000);
  paintTimer(); paintBtns();
}
function paintTimer() {
  const ring = $("#ring"); if (!ring) return;
  const frac = T.total ? T.left / T.total : 0;
  $("#ring .bar").style.strokeDashoffset = String(CIRC * (1 - frac));
  ring.classList.toggle("low", T.left <= 5);
  ring.classList.toggle("done", T.left === 0);
  const m = Math.floor(T.left / 60), s = T.left % 60;
  $("#ring .num").textContent = T.left === 0 ? "انتهى الوقت" : (T.total >= 60 ? `${m}:${String(s).padStart(2, "0")}` : ar(T.left));
}
function paintBtns() { const b = $("#tbtn"); if (b) b.textContent = T.id ? "إيقاف" : (T.left === 0 || T.left === T.total ? "ابدأ" : "استئناف"); }
const timerHTML = (label) => `

    <div class="row"><button class="btn" id="tbtn" data-a="timer">ابدأ</button><button class="btn soft" data-a="treset">إعادة</button></div>

        <li><span class="ico">اللوحة</span><span>ست جولات، كل جولة مرتبطة بيوم من أيام الورشة، وفيها أربعة أسئلة بقيم <b>10 و20 و30 و40</b> نقطة. الفريق المختار يحدد السؤال.</span></li>
        <li><span class="ico">الإجابة</span><span>تجيب الفرق على ورقة أو برفع البطاقة قبل انتهاء الوقت، ثم يكشف المدرب الإجابة ويمنح النقاط لكل فريق أصاب.</span></li>
        <li><span class="ico">التبرير</span><span>نقاط إضافية للفريق الذي <b>يبرر</b> إجابته تبريرًا مقنعًا، حتى لو أجاب غيره إجابة صحيحة.</span></li>
        <li><span class="ico">مضاعفة</span><span>بطاقة <b>المضاعفة</b>: مرة واحدة لكل فريق، تُعلن قبل كشف الإجابة، فتتضاعف نقاط ذلك السؤال.</span></li>
        <li><span class="ico">اسأل الأداة</span><span>مرة واحدة لكل فريق: يستشير أداة ذكاء اصطناعي لمدة 30 ثانية، ثم <b>يراجع</b> جوابها بنفسه قبل أن يعتمده.</span></li>
        <li><span class="ico">الختام</span><span>التحدي الختامي: كل فريق يكتب أمرًا ذكيًا، ويقيّمه المدرب بخمسة معايير، 4 نقاط لكل معيار.</span></li>
      </ul>
    </section>
  </div>`;
}

function vBoard() {
  const R = bank.rounds;
  const cols = R.map((r) => `<div class="col-h"><div class="day">${esc(r.day)}</div><div class="t">${esc(r.name)}</div></div>`).join("");
  const maxQ = Math.max(...R.map((r) => r.qs.length));
  let tiles = "";
  for (let qi = 0; qi < maxQ; qi++) R.forEach((r, ri) => {
    const q = r.qs[qi];
    if (!q) { tiles += `<div></div>`; return; }
    const used = S.used[`${ri}-${qi}`];
    tiles += `<button class="tile ${used ? "used" : ""}" data-a="open" data-r="${ri}" data-q="${qi}" aria-label="${esc(r.name)}، ${q.pts} نقطة${used ? "، تمت الإجابة" : ""}">${used ? "تمت ✓" : ar(q.pts)}</button>`;
  });
  const left = R.reduce((a, r, ri) => a + r.qs.filter((_, qi) => !S.used[`${ri}-${qi}`]).length, 0);
  const finals = bank.finals.map((f, i) => `<button class="btn ${S.finalsDone[i] ? "soft" : ""}" data-a="final" data-i="${i}">التحدي ${ar(i + 1)}${S.finalsDone[i] ? " ✓" : ""}</button>`).join("");
  return `
  <div class="board-head">
    <div><h1>لوحة الجولات</h1><p class="lead">اختر جولة وقيمة. الأسئلة المجاب عنها تبقى ظاهرة ويمكن فتحها مجددًا للمراجعة. المتبقي: ${ar(left)} سؤالًا.</p></div>
    <button class="btn ghost" data-go="scores">عرض النتائج</button>
  </div>
  <div class="board-scroll"><div class="board">${cols}${tiles}
    <div class="final-tile"><div><div class="t">التحدي الختامي: ابنِ أمرك</div><div style="color:var(--muted);font-size:.85em">يُلعب في نهاية اليوم الخامس · حتى 20 نقطة لكل فريق</div></div><div class="row">${finals}</div></div>
  </div></div>`;
}

function vQuestion() {
  const { r, q } = S.cur, round = bank.rounds[r], Q = round.qs[q];
  const tl = Q.options.length === 3;
  const opts = Q.options.map((o, i) => {
    const cls = S.revealed ? (i === Q.correct ? "right" : "dim") : "";
    return `<div class="opt ${cls}"><span class="k">${KEYS[i]}</span><span>${esc(o)}</span></div>`;
  }).join("");
  const src = Q.source ? `<div class="source"><div class="doc"><span class="lb">المصدر الأصلي</span>${esc(Q.source)}</div><div class="doc ai"><span class="lb">مخرج الأداة</span>${esc(Q.ai || "")}</div></div>` : "";
  const awarded = S.awarded || {};
  const cards = S.teams.map((t, i) => {
    const got = awarded[i] || {};
    const mult = S.armed === i ? 2 : 1;
    return `<div class="acard ${S.armed === i ? "armed" : ""}">
      <div class="top"><span class="tn">${esc(t.name)}</span><span class="sc">${ar(t.score)}</span></div>
      <div class="row">
        ${S.revealed
          ? `<button class="mini main" data-a="award" data-i="${i}" ${got.main ? "disabled" : ""}>${got.main ? "مُنحت ✓" : "إجابة صحيحة (" + ar(Q.pts * mult) + ")"}</button>
             <button class="mini" data-a="bonus" data-i="${i}" ${got.bonus ? "disabled" : ""}>${got.bonus ? "تبرير ✓" : "تبرير (5)"}</button>`
          : `<button class="mini gold" data-a="arm" data-i="${i}" ${t.dbl && S.armed !== i ? "disabled" : ""}>${S.armed === i ? "إلغاء المضاعفة" : (t.dbl ? "استُخدمت المضاعفة" : "استخدم المضاعفة")}</button>
             <button class="mini" data-a="ask" data-i="${i}" ${t.ask ? "disabled" : ""}>${t.ask ? "استُخدمت الأداة" : "اسأل الأداة"}</button>`}
      </div></div>`;
  }).join("");
  return `
  <div class="qtop">
    <button class="btn soft" data-a="back">→ اللوحة</button>
    <div class="meta"><span class="pill">${esc(round.day)}</span><span class="pill">${esc(round.name)}</span><span class="pill pts">${ar(Q.pts)} نقطة</span></div>
  </div>
  <div class="qgrid">
    <section class="pop">
      <p class="prompt">${esc(Q.prompt)}</p>
      ${src}
      <div class="opts ${tl ? "three" : ""}">${opts}</div>
      ${S.revealed ? `<div class="explain"><b>الإجابة: ${KEYS[Q.correct]}. ${esc(Q.options[Q.correct])}</b><br>${esc(Q.explain)}</div>` : ""}
      <div class="award">
        <h3>${S.revealed ? "امنح النقاط" : "قبل كشف الإجابة"}</h3>
        <p class="hint">${S.revealed ? "اضغط على كل فريق أصاب. نقاط التبرير تُمنح لمن قدّم تفسيرًا مقنعًا." : "أعلن الآن استخدام بطاقة المضاعفة أو «اسأل الأداة» إن رغب فريق بذلك."}</p>
        <div class="agrid">${cards}</div>
      </div>
    </section>
    <aside class="side">
      ${timerHTML("الوقت المقترح: " + ar(Q.time) + " ثانية")}
      <button class="btn" data-a="reveal" ${S.revealed ? "disabled" : ""}>كشف الإجابة</button>
      <button class="btn ghost" data-a="back">التالي: العودة للوحة</button>
    </aside>
  </div>`;
}

function vFinal() {
  const i = S.cur.f, F = bank.finals[i], R = bank.rubric;
  const marks = (S.rubs || {})[i] || {};
  const rows = S.teams.map((t, ti) => {
    const m = marks[ti] || [];
    const tot = m.filter(Boolean).length * RUBRIC_PTS;
    return `<tr><td>${esc(t.name)}</td>${R.map((_, ci) => `<td><input type="checkbox" id="rb-${ti}-${ci}" data-a="rub" data-t="${ti}" data-c="${ci}" ${m[ci] ? "checked" : ""} ${S.finalsDone[i] ? "disabled" : ""} aria-label="${esc(t.name)}: ${esc(R[ci])}"></td>`).join("")}<td class="tot">${ar(tot)}</td></tr>`;
  }).join("");
  return `
  <div class="qtop">
    <button class="btn soft" data-a="back">→ اللوحة</button>
    <div class="meta"><span class="pill">اليوم الخامس</span><span class="pill">التحدي الختامي ${ar(i + 1)}</span><span class="pill pts">حتى ${ar(R.length * RUBRIC_PTS)} نقطة</span></div>
  </div>
  <div class="qgrid">
    <section class="pop">
      <p style="margin:0;color:var(--rose);font-weight:800">المهمة</p>
      <p class="task">${esc(F.task)}</p>
      <div class="rub-scroll"><table class="rub"><thead><tr><th>الفريق</th>${R.map((c) => `<th>${esc(c)}</th>`).join("")}<th>المجموع</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="row" style="margin-top:16px">
        ${S.finalsDone[i] ? `<span class="done-flag">أُضيفت الدرجات إلى النتائج ✓</span>` : `<button class="btn" data-a="commit">اعتمد الدرجات وأضفها للنتائج</button>`}
      </div>
    </section>
    <aside class="side">${timerHTML("وقت الكتابة: " + ar(Math.round(F.time / 60)) + " دقائق")}</aside>
  </div>`;
}

function vScores() {
  const ranked = S.teams.map((t, i) => ({ ...t, i })).sort((a, b) => b.score - a.score);
  const top = ranked[0], tie = ranked.length > 1 && ranked[1].score === top.score;
  const showWinner = S.showWinner && top && top.score > 0;
  return `
  <div class="board-head">
    <div><h1>النتائج</h1><p class="lead">الترتيب يتحدث مباشرة. استخدم أزرار التعديل لتصحيح أي نقاط يدويًا.</p></div>
    <div class="row"><button class="btn" data-a="winner">${showWinner ? "إخفاء التتويج" : "تتويج البطل"}</button><button class="btn ghost" data-go="board">لوحة الجولات</button></div>
  </div>
  ${showWinner ? `<div class="winner pop"><img src="${LOGO_C}" alt="زواد"><div class="w">${tie ? "تعادل في الصدارة!" : "بطل تحدي الأثر: " + esc(top.name)}</div><div>${ar(top.score)} نقطة</div></div>` : ""}
  <div class="podium">${ranked.map((t, k) => `
    <div class="rank ${k === 0 && t.score > 0 ? "first" : ""}"><span class="pos">${ar(k + 1)}</span><span class="tn">${esc(t.name)}</span><span class="big">${ar(t.score)}</span>
      <span class="adj"><button class="mini" data-a="adj" data-i="${t.i}" data-d="-5" aria-label="خصم 5">خصم 5</button><button class="mini" data-a="adj" data-i="${t.i}" data-d="5" aria-label="إضافة 5">إضافة 5</button></span></div>`).join("")}
  </div>`;
}

function vEdit() {
  const ri = Math.min(S.edRound || 0, bank.rounds.length - 1), R = bank.rounds[ri];
  const qcards = R.qs.map((q, qi) => `
    <div class="qcard">
      <div class="hd"><b>سؤال ${ar(q.pts)} نقطة</b>
        <span class="row"><label class="fld" style="grid-auto-flow:column;align-items:center">النقاط <input type="number" id="e-${ri}-${qi}-pts" data-e="pts" data-q="${qi}" value="${q.pts}" min="5" step="5" style="width:90px"></label>
        <label class="fld" style="grid-auto-flow:column;align-items:center">الوقت بالثواني <input type="number" id="e-${ri}-${qi}-time" data-e="time" data-q="${qi}" value="${q.time}" min="5" step="5" style="width:90px"></label></span></div>
      <label class="fld">نص السؤال<textarea id="e-${ri}-${qi}-prompt" data-e="prompt" data-q="${qi}">${esc(q.prompt)}</textarea></label>
      <div class="f2">
        <label class="fld">المصدر الأصلي (اختياري، لجولات المقارنة)<textarea id="e-${ri}-${qi}-source" data-e="source" data-q="${qi}">${esc(q.source || "")}</textarea></label>
        <label class="fld">مخرج الأداة (اختياري)<textarea id="e-${ri}-${qi}-ai" data-e="ai" data-q="${qi}">${esc(q.ai || "")}</textarea></label>
      </div>
      <div class="fld">الخيارات (حدد الإجابة الصحيحة بالدائرة؛ اترك الخيار الرابع فارغًا لسؤال بثلاثة خيارات)</div>
      ${[0, 1, 2, 3].map((oi) => `<div class="oprow"><input type="radio" name="c-${ri}-${qi}" id="e-${ri}-${qi}-c${oi}" data-e="correct" data-q="${qi}" data-o="${oi}" ${q.correct === oi ? "checked" : ""} aria-label="الإجابة الصحيحة ${KEYS[oi]}"><input type="text" id="e-${ri}-${qi}-o${oi}" data-e="opt" data-q="${qi}" data-o="${oi}" value="${esc(q.options[oi] || "")}" placeholder="الخيار ${KEYS[oi]}"></div>`).join("")}
      <label class="fld">الشرح بعد كشف الإجابة<textarea id="e-${ri}-${qi}-explain" data-e="explain" data-q="${qi}">${esc(q.explain)}</textarea></label>
    </div>`).join("");
  return `
  <div class="board-head"><div><h1>بنك الأسئلة</h1><p class="lead">عدّل الأسئلة من ورشة لأخرى. يُحفظ التعديل تلقائيًا على هذا الجهاز وهذا المتصفح فقط، فجهّز الأسئلة على الجهاز الذي ستعرض منه.</p></div>
    <span class="saved" id="savedMsg" aria-live="polite"></span></div>
  <div class="ed-head">
    <label>الجولة<select id="edSel" data-a="edsel">${bank.rounds.map((r, i) => `<option value="${i}" ${i === ri ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select></label>
    <label>اسم الجولة<input type="text" id="e-${ri}-name" data-e="rname" value="${esc(R.name)}"></label>
    <label>اليوم<input type="text" id="e-${ri}-day" data-e="rday" value="${esc(R.day)}"></label>
  </div>
  ${qcards}
  <div class="qcard"><div class="hd"><b>التحدي الختامي</b></div>
    ${bank.finals.map((f, i) => `<label class="fld">المهمة ${ar(i + 1)}<textarea id="e-final-${i}" data-e="final" data-q="${i}">${esc(f.task)}</textarea></label>`).join("")}
  </div>
  <div class="row"><button class="btn ghost" data-a="askbank">استعادة الأسئلة الأصلية</button></div>
  <div id="bankBox"></div>`;
}

function render() {
  renderNav();
  const V = { setup: vSetup, board: vBoard, q: vQuestion, final: vFinal, scores: vScores, edit: vEdit }[S.view] || vSetup;
  $("#view").innerHTML = V();
  if (S.view === "q" || S.view === "final") { paintTimer(); paintBtns(); }
}

/* ---------- actions ---------- */
function addPts(i, n) { S.teams[i].score += n; save(); }
document.addEventListener("click", (e) => {
  const g = e.target.closest("[data-go]"); if (g) { go(g.dataset.go); return; }
  const b = e.target.closest("[data-a]"); if (!b || b.disabled) return;
  const a = b.dataset.a, i = +b.dataset.i;
  if (a === "open") {
    const r = +b.dataset.r, q = +b.dataset.q;
    S.used[`${r}-${q}`] = true;
    go("q", { cur: { r, q }, revealed: false, armed: null, awarded: {} });
    setTimer(bank.rounds[r].qs[q].time); return;
  }
  if (a === "final") { go("final", { cur: { f: i } }); setTimer(bank.finals[i].time); return; }
  if (a === "back") { go("board"); return; }
  if (a === "timer") { toggleTimer(); return; }
  if (a === "treset") { setTimer(T.total); paintBtns(); return; }
  if (a === "reveal") { stopTimer(); S.revealed = true; if (S.armed !== null) S.teams[S.armed].dbl = true; save(); render(); beep(990, 0.12, 2); return; }
  if (a === "arm") { S.armed = S.armed === i ? null : i; save(); render(); return; }
  if (a === "ask") { S.teams[i].ask = true; save(); render(); setTimer(30); toggleTimer(); return; }
  if (a === "award") { const Q = bank.rounds[S.cur.r].qs[S.cur.q]; addPts(i, Q.pts * (S.armed === i ? 2 : 1)); S.awarded[i] = { ...(S.awarded[i] || {}), main: true }; save(); render(); beep(780, 0.12); return; }
  if (a === "bonus") { addPts(i, 5); S.awarded[i] = { ...(S.awarded[i] || {}), bonus: true }; save(); render(); return; }
  if (a === "rub") { const f = S.cur.f; S.rubs = S.rubs || {}; S.rubs[f] = S.rubs[f] || {}; const t = +b.dataset.t, c = +b.dataset.c; S.rubs[f][t] = S.rubs[f][t] || []; S.rubs[f][t][c] = b.checked; save(); render(); paintTimer(); return; }
  if (a === "commit") { const f = S.cur.f; const m = (S.rubs || {})[f] || {}; S.teams.forEach((t, ti) => { t.score += (m[ti] || []).filter(Boolean).length * RUBRIC_PTS; }); S.finalsDone[f] = true; save(); render(); beep(990, 0.15, 3); return; }
  if (a === "adj") { addPts(i, +b.dataset.d); render(); return; }
  if (a === "winner") { S.showWinner = !S.showWinner; save(); render(); if (S.showWinner) beep(660, 0.18, 3); return; }
  if (a === "addteam") { const n = S.teams.length + 1; S.teams.push({ name: "الفريق " + ar(n), score: 0, dbl: false, ask: false }); save(); render(); return; }
  if (a === "delteam") { S.teams.splice(i, 1); save(); render(); return; }
  if (a === "askreset") { $("#resetBox").innerHTML = `<div class="confirm" style="margin-top:14px"><p style="margin:0 0 10px">ستُصفَّر النقاط وتعود كل الأسئلة متاحة، مع الإبقاء على أسماء الفرق. هل تبدأ مسابقة جديدة؟</p><div class="row"><button class="btn" data-a="doreset">نعم، ابدأ من جديد</button><button class="btn soft" data-a="cancel">إلغاء</button></div></div>`; return; }
  if (a === "doreset") { const names = S.teams.map((t) => t.name); S = freshState(); S.teams = names.map((n) => ({ name: n, score: 0, dbl: false, ask: false })); save(); render(); return; }
  if (a === "cancel") { e.target.closest(".confirm").remove(); return; }
  if (a === "askbank") { $("#bankBox").innerHTML = `<div class="confirm" style="margin-top:14px"><p style="margin:0 0 10px">ستُحذف كل تعديلاتك على الأسئلة وتعود الأسئلة الأصلية. هل تتابع؟</p><div class="row"><button class="btn" data-a="dobank">نعم، استعد الأصلية</button><button class="btn soft" data-a="cancel">إلغاء</button></div></div>`; return; }
  if (a === "dobank") { bank = clone(DEFAULT_BANK); store.del("athar-bank"); render(); return; }
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset.team !== undefined) { S.teams[+el.dataset.team].name = el.value; save(); renderNav(); return; }
  if (el.dataset.e) {
    const R = bank.rounds[S.edRound || 0], k = el.dataset.e, q = +el.dataset.q;
    if (k === "rname") R.name = el.value;
    else if (k === "rday") R.day = el.value;
    else if (k === "final") bank.finals[q].task = el.value;
    else if (k === "opt") { const Q = R.qs[q], o = +el.dataset.o; Q.options[o] = el.value; while (Q.options.length && !String(Q.options[Q.options.length - 1]).trim()) Q.options.pop(); if (Q.correct >= Q.options.length) Q.correct = 0; }
    else if (k === "correct") R.qs[q].correct = +el.dataset.o;
    else if (k === "pts" || k === "time") R.qs[q][k] = Math.max(5, +el.value || 5);
    else R.qs[q][k] = el.value;
    saveBank(); const m = $("#savedMsg"); if (m) { m.textContent = "حُفظ التعديل"; clearTimeout(m._t); m._t = setTimeout(() => (m.textContent = ""), 1500); }
  }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "edSel") { S.edRound = +e.target.value; save(); render(); }
  if (e.target.dataset.e === "correct") { bank.rounds[S.edRound || 0].qs[+e.target.dataset.q].correct = +e.target.dataset.o; saveBank(); }
});
document.addEventListener("keydown", (e) => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === "Escape" && (S.view === "q" || S.view === "final")) go("board");
  if ((S.view === "q" || S.view === "final") && e.code === "Space") { e.preventDefault(); toggleTimer(); }
  if (S.view === "q" && (e.key === "r" || e.key === "R" || e.key === "ق") && !S.revealed) $('[data-a="reveal"]')?.click();
});

/* ---------- boot ---------- */
function start(data) {
  if (data && data.S) S = data.S;
  if (S.view === "q" && S.cur && !bank.rounds[S.cur.r]?.qs[S.cur.q]) S.view = "board";
  render();
  if (S.view === "q") setTimer(bank.rounds[S.cur.r].qs[S.cur.q].time);
  if (S.view === "final") setTimer(bank.finals[S.cur.f].time);
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
